<mat-toolbar class="app-toolbar" role="banner">
  <div class="toolbar-left">
    <div class="brand">
      <span class="brand-logo">Aurora</span>
      <span class="brand-tag">Lighting the Way to Confident Reading</span>
    </div>
  </div>

  <div class="toolbar-center">
    <ng-container *ngIf="!isLoggedIn; else loggedInMenu">
      <button mat-button routerLink="/home" routerLinkActive="active" class="nav-btn">Home</button>
      <button mat-button routerLink="/about" routerLinkActive="active" class="nav-btn">About</button>
      <button mat-button (click)="openLogin()" class="nav-btn">Login</button>
    </ng-container>
    <ng-template #loggedInMenu>
      <button mat-button routerLink="/home" routerLinkActive="active" class="nav-btn">Home</button>
      <button mat-button routerLink="/about" routerLinkActive="active" class="nav-btn">About</button>
      <button mat-button routerLink="/tasks" routerLinkActive="active" class="nav-btn">Tasks</button>
      <app-settings></app-settings>
    </ng-template>
  </div>

  <div class="toolbar-right">
    <app-user-profile-card></app-user-profile-card>
  </div>
</mat-toolbar>
