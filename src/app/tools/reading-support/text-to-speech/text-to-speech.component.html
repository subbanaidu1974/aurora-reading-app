<div class="feature-detail">
  <div class="header-section">
    <h2>Text-to-Speech (TTS)</h2>
    <div class="voice-selector">
      <label for="voice-select">Voice:</label>
      <select id="voice-select" [(ngModel)]="selectedVoice" [compareWith]="compareVoices" class="voice-select">
        <option *ngFor="let voice of availableVoices" [ngValue]="voice">
          {{ voice.name }} ({{ voice.lang }})
        </option>
      </select>
    </div>
  </div>
  
  <!-- Top Section: Upload and Speed Controls Side by Side -->
  <div class="top-controls-wrapper">
    <!-- File Upload Section (Left) -->
    <div class="upload-section" 
         [class.drag-over]="isDragOver"
         (dragover)="onDragOver($event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop($event)"
         (click)="fileInput.click()">
      <input 
        #fileInput
        type="file" 
        accept=".pdf,.doc,.docx,.txt"
        (change)="onFileUpload($event)"
        class="file-input">
      
      <div class="upload-content">
        <div class="upload-icon">📄</div>
        <h3 class="upload-title">Drag & Drop Your File Here</h3>
        <p class="upload-subtitle">or click to browse</p>
        <p class="upload-formats">Supports PDF, DOC, DOCX, TXT</p>
      </div>
    </div>
  </div>

  <!-- TTS Controls -->
  <div class="tts-container">
    <!-- PDF Viewer with Page Navigation -->
    <div class="pdf-viewer" *ngIf="isPdfFile">
      <!-- File Info -->
      <!-- All Controls in One Row -->
      <div class="playback-controls">
        <button 
          mat-icon-button
          (click)="play()" 
          [disabled]="isPlaying" 
          class="control-btn"
          matTooltip="Play">
          <mat-icon>play_arrow</mat-icon>
        </button>
        
        <button 
          mat-icon-button
          (click)="pause()" 
          [disabled]="!isPlaying" 
          class="control-btn"
          matTooltip="Pause">
          <mat-icon>pause</mat-icon>
        </button>
        
        <button 
          mat-icon-button
          (click)="stop()" 
          [disabled]="!isPlaying && !isPaused" 
          class="control-btn"
          matTooltip="Stop">
          <mat-icon>stop</mat-icon>
        </button>
        
        <div class="divider"></div>
        
        <button 
          mat-icon-button
          (click)="setSpeed(0.75)" 
          [class.active]="speechRate === 0.75" 
          class="speed-btn" 
          matTooltip="Slow (0.75x)">
          <mat-icon>directions_walk</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(1.0)" 
          [class.active]="speechRate === 1.0" 
          class="speed-btn" 
          matTooltip="Normal (1.0x)">
          <mat-icon>person</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(1.5)" 
          [class.active]="speechRate === 1.5" 
          class="speed-btn" 
          matTooltip="Fast (1.5x)">
          <mat-icon>directions_run</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(2.0)" 
          [class.active]="speechRate === 2.0" 
          class="speed-btn" 
          matTooltip="Very Fast (2.0x)">
          <mat-icon>rocket_launch</mat-icon>
        </button>
        
        <div class="divider"></div>
        
        <button 
          mat-icon-button
          (click)="showPdfPage(currentPage - 1)" 
          [disabled]="currentPage <= 1" 
          class="pdf-nav-btn"
          matTooltip="Previous Page">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <span class="page-info">Page {{ currentPage }} of {{ totalPages }}</span>
        <button 
          mat-icon-button
          (click)="showPdfPage(currentPage + 1)" 
          [disabled]="currentPage >= totalPages" 
          class="pdf-nav-btn"
          matTooltip="Next Page">
          <mat-icon>chevron_right</mat-icon>
        </button>
        
        <div class="divider" *ngIf="uploadedFileName"></div>
        
        <div class="file-info-inline" *ngIf="uploadedFileName">
          <span class="file-name">{{ uploadedFileName }}</span>
          <button class="clear-file-btn" (click)="clearFile($event)" title="Remove file" matTooltip="Remove file">
            ✕
          </button>
        </div>
      </div>
      <div class="pdf-text-container">
        <div class="pdf-page-text">
          <span *ngFor="let word of currentPageWords; let i = index" 
                [class.highlighted]="i === currentPageWordIndex"
                [id]="'pdf-word-' + i"
                class="word">
            {{ word }}
          </span>
        </div>
      </div>
    </div>
    
    <!-- Text Display (for non-PDF files) -->
    <div class="text-display" [class.scrollable]="isFileUploaded" *ngIf="!isPdfFile" #textDisplay>
      <!-- Playback Control Buttons -->
      <div class="playback-controls">
        <button 
          mat-icon-button
          (click)="play()" 
          [disabled]="isPlaying" 
          class="control-btn"
          matTooltip="Play">
          <mat-icon>play_arrow</mat-icon>
        </button>
        
        <button 
          mat-icon-button
          (click)="pause()" 
          [disabled]="!isPlaying" 
          class="control-btn"
          matTooltip="Pause">
          <mat-icon>pause</mat-icon>
        </button>
        
        <button 
          mat-icon-button
          (click)="stop()" 
          [disabled]="!isPlaying && !isPaused" 
          class="control-btn"
          matTooltip="Stop">
          <mat-icon>stop</mat-icon>
        </button>
        
        <div class="divider"></div>
        
        <button 
          mat-icon-button
          (click)="setSpeed(0.75)" 
          [class.active]="speechRate === 0.75" 
          class="speed-btn" 
          matTooltip="Slow (0.75x)">
          <mat-icon>directions_walk</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(1.0)" 
          [class.active]="speechRate === 1.0" 
          class="speed-btn" 
          matTooltip="Normal (1.0x)">
          <mat-icon>person</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(1.5)" 
          [class.active]="speechRate === 1.5" 
          class="speed-btn" 
          matTooltip="Fast (1.5x)">
          <mat-icon>directions_run</mat-icon>
        </button>
        <button 
          mat-icon-button
          (click)="setSpeed(2.0)" 
          [class.active]="speechRate === 2.0" 
          class="speed-btn" 
          matTooltip="Very Fast (2.0x)">
          <mat-icon>rocket_launch</mat-icon>
        </button>
        
        <div class="divider" *ngIf="uploadedFileName"></div>
        
        <div class="file-info-inline" *ngIf="uploadedFileName">
          <span class="file-name">{{ uploadedFileName }}</span>
          <button class="clear-file-btn" (click)="clearFile($event)" title="Remove file" matTooltip="Remove file">
            ✕
          </button>
        </div>
      </div>
      
      <span *ngFor="let word of words; let i = index" 
            [class.highlighted]="i === currentWordIndex"
            [id]="'word-' + i"
            class="word">
        {{ word }}
      </span>
    </div>
  </div>
</div>
