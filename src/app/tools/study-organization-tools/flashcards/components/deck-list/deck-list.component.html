<div class="deck-grid">
  <div class="decks-area" *ngIf="(decksWithMeta$ | async) as decks">
    <mat-card *ngFor="let d of decks" class="deck-card">
      <div class="category-tape" [style.background]="d.category?.color || 'linear-gradient(90deg,#EAF8F8,#FFF8E1)'">
        <div class="tape-left">
          <ng-container *ngIf="d.category?.icon as ic">
            <ng-container *ngIf="isUrl(ic); else matIcon">
              <img [src]="ic" alt="" class="cat-icon" />
            </ng-container>
            <ng-template #matIcon>
              <mat-icon class="cat-icon">{{ ic }}</mat-icon>
            </ng-template>
          </ng-container>
          <div class="cat-name">{{ d.category?.name || 'Uncategorized' }}</div>
        </div>
        <div class="tape-actions">
          <button mat-icon-button color="primary" (click)="study(d.id)" aria-label="Study deck">
            <mat-icon>menu_book</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="remove(d.id)" aria-label="Delete deck">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
      <mat-card-title>{{ d.name }}</mat-card-title>
      <mat-card-content>
        <div class="desc">{{ d.description }}</div>
        <div class="meta">{{ d.cards.length }} cards</div>

        <div class="cards-preview" *ngIf="d.cards && d.cards.length">
          <mat-card class="mini-card" *ngFor="let c of d.cards | slice:0:6">
            <mat-card-content>
              <div class="mini-front">{{ c.frontText }}</div>
            </mat-card-content>
          </mat-card>
        </div>
      </mat-card-content>
      <!-- actions moved into the top tape for quick access -->
    </mat-card>
  </div>

  <div class="create">
    <mat-card class="create-deck-card">
      <mat-card-title>Create Deck</mat-card-title>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="add()">
          <mat-form-field appearance="outline" class="full"><mat-label>Name</mat-label><input matInput formControlName="name" /></mat-form-field>
          <mat-form-field appearance="outline" class="full"><mat-label>Description</mat-label><input matInput formControlName="description" /></mat-form-field>
          <mat-form-field appearance="outline" class="full">
            <mat-label>Category</mat-label>
            <mat-select formControlName="categoryId">
              <mat-option value="">None</mat-option>
              <mat-option *ngFor="let c of (categories$ | async)" [value]="c.id">{{ c.name }}</mat-option>
            </mat-select>
          </mat-form-field>
          <div class="actions">
            <button mat-flat-button class="m3-create-btn" type="submit"><mat-icon>add</mat-icon>&nbsp;Create</button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <div class="create-flashcard">
      <fc-create></fc-create>
    </div>
  </div>
</div>
