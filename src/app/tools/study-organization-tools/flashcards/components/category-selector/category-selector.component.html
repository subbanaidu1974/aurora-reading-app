<div class="category-grid" role="list">
  <button
    type="button"
    *ngFor="let c of (categories$ | async)"
    class="category-card"
    [class.selected]="selectedId === c.id"
    [attr.aria-pressed]="selectedId === c.id"
    [style.background]="c.color"
    (click)="select(c.id)"
    (keydown)="onKeydown($event, c.id)"
    tabindex="0"
    role="listitem"
  >
    <ng-container *ngIf="c.iconImage; else textFallback">
      <img class="cat-img" [src]="c.iconImage" alt="{{ c.name }} icon">
    </ng-container>
    <ng-template #textFallback>
      <div class="cat-initial" aria-hidden="true">{{ (c.name || c.id || '') | slice:0:1 | uppercase }}</div>
    </ng-template>
    <div class="name">{{ c.name }}</div>
  </button>
</div>
